plugins {
    id 'com.android.application'
}

android {
    namespace 'com.carlosart.cerberusia'
    compileSdk 34

    defaultConfig {
        applicationId "com.carlosart.cerberusia"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "2.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
}
